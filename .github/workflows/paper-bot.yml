name: paper-bot

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: paper-bot

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 pytest==8.3.3
      - run: python -m pytest -q builds/trading-bot/tests
      - run: python builds/trading-bot/bot.py
      - name: Save paper results
        run: |
          git config user.name "eur10-paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/trading-bot/state
          git diff --cached --quiet || git commit -m "paper: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || (git pull --rebase origin "$GITHUB_REF_NAME" && git push)
